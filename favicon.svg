<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The outcome node alone: the amber circle and its three sparks. At
       favicon size the full trajectory collapses into mush, and this is the
       part of the mark that carries the meaning anyway. -->
  <circle cx="38" cy="62" r="30" fill="#F5A623"/>
  <g stroke="#F5A623" stroke-width="6.7" stroke-linecap="round">
    <line x1="65.5" y1="39.5" x2="82" y2="26"/>
    <line x1="69" y1="62" x2="90" y2="62"/>
    <line x1="56" y1="30" x2="60" y2="16"/>
  </g>
</svg>
